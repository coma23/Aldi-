  <circle cx="161" cy="650" r="455" fill="url(#dot-vallemonumentos)" opacity="0.16" /><circle cx="931" cy="312" r="383" fill="url(#dot-vallemonumentos)" opacity="0.19" /><circle cx="467" cy="5" r="483" fill="url(#dot-vallemonumentos)" opacity="0.20" /><circle cx="921" cy="235" r="523" fill="url(#dot-vallemonumentos)" opacity="0.18" /><circle cx="1" cy="612" r="536" fill="url(#dot-vallemonumentos)" opacity="0.20" /><circle cx="409" cy="128" r="312" fill="url(#dot-vallemonumentos)" opacity="0.11" /><circle cx="289" cy="342" r="507" fill="url(#dot-vallemonumentos)" opacity="0.17" />
